<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Educa | Mi Score</title>
    <link rel="stylesheet" href="../../assets/css/reset.css">
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/pages.css">
</head>
<body style="background-color: var(--color-bg);">
    
    <header style="background-color: white; padding: 1rem 2rem; border-bottom: 1px solid var(--color-border); display: flex; justify-content: space-between; align-items: center;">
        <div style="font-weight: 700; color: var(--color-secondary); font-size: 1.2rem;">Portal del Estudiante</div>
        <button id="btn-logout" class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">Cerrar Sesión</button>
    </header>

    <main class="main-content" style="padding: 2rem; display: flex; justify-content: center; align-items: flex-start; min-height: calc(100vh - 70px);">
        
        <div class="card" style="max-width: 600px; width: 100%; text-align: center; padding: 3rem 2rem;">
            <div style="width: 80px; height: 80px; background-color: rgba(15, 118, 110, 0.1); color: var(--color-secondary); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem auto;">
                <svg width="40" height="40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222"></path></svg>
            </div>
            
            <h1 style="color: var(--color-text-main); margin-bottom: 0.5rem; font-size: 1.8rem;">Bienvenido a tu perfil</h1>
            <p style="color: var(--color-text-muted); margin-bottom: 2rem;">Hola <span id="student-name" style="font-weight: 700; color: var(--color-primary);"></span>, aquí puedes ver tu rendimiento.</p>
            
            <div style="background-color: #F8FAFC; border: 1px solid var(--color-border); border-radius: var(--border-radius-md); padding: 2rem;">
                <h2 style="font-size: 3.5rem; color: var(--color-secondary); margin-bottom: 0.5rem; font-weight: 800;">A+</h2>
                <p style="color: var(--color-text-muted); font-size: 0.95rem;">Rendimiento Académico Actual</p>
                <div style="margin-top: 1rem; display: inline-block; padding: 0.4rem 1rem; background-color: #dcfce7; color: #166534; border-radius: 20px; font-size: 0.85rem; font-weight: 600;">Excelente Desempeño</div>
            </div>
            
            <p style="margin-top: 2rem; font-size: 0.85rem; color: var(--color-text-muted);">Tus datos personales están protegidos de los demás estudiantes.</p>
        </div>
    </main>

    <!-- Módulo JS del Perfil de Estudiante -->
    <script type="module" src="../modules/estudiantes/score.js"></script>
</body>
</html>
