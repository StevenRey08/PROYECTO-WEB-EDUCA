<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Educa | Registro</title>
    
    <!-- Enlaces a CSS Global -->
    <link rel="stylesheet" href="../../assets/css/reset.css">
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/pages.css">
</head>
<body style="background-color: var(--color-bg);">
    
    <!-- Fondo animado de figuras flotantes -->
    <div class="floating-bg">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
        <div class="shape shape-5"></div>
        <div class="shape shape-6"></div>
    </div>

    <main class="main-content" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--spacing-md);">
        <div class="card" style="max-width: 450px; width: 100%;">
            <div style="text-align: center; margin-bottom: var(--spacing-xl);">
                <h1 style="color: var(--color-primary); font-size: 1.8rem; margin-bottom: var(--spacing-sm);">Crear Cuenta</h1>
                <p style="color: var(--color-text-muted);">Únete a Proyecto Educa</p>
            </div>
            
            <form id="registro-form" autocomplete="off">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ej. Juan Pérez" required>
                </div>

                <div class="form-group">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" name="correo" class="form-control" placeholder="juan@ejemplo.com" required>
                </div>
                
                <div class="form-group">
                    <label for="clave">Contraseña</label>
                    <input type="password" id="clave" name="clave" class="form-control" placeholder="Mínimo 6 caracteres" required>
                </div>

                <div class="form-group">
                    <label for="clave-confirmar">Confirmar Contraseña</label>
                    <input type="password" id="clave-confirmar" name="clave-confirmar" class="form-control" placeholder="Repite la contraseña" required>
                </div>
                
                <!-- Contenedor de error -->
                <div id="error-message" style="color: #dc2626; font-size: 0.85rem; margin-bottom: var(--spacing-md); display: none; text-align: center; background-color: #fee2e2; padding: 8px; border-radius: var(--border-radius-sm);"></div>
                
                <!-- Contenedor de éxito -->
                <div id="success-message" style="color: var(--color-secondary); font-size: 0.85rem; margin-bottom: var(--spacing-md); display: none; text-align: center; background-color: #dcfce7; padding: 8px; border-radius: var(--border-radius-sm);"></div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--spacing-sm);">
                    Registrarse
                </button>
            </form>
            
            <div style="text-align: center; margin-top: var(--spacing-lg); font-size: 0.9rem;">
                <span style="color: var(--color-text-muted);">¿Ya tienes una cuenta?</span>
                <a href="login.html" style="color: var(--color-primary); text-decoration: none; font-weight: 500;">Inicia Sesión</a>
            </div>
        </div>
    </main>

    <!-- Módulo JS de Registro -->
    <script type="module" src="../modules/auth/registro.js"></script>
</body>
</html>
